{% extends "base.html" %}
{% block content %}
<div class="fade-up">
<div class="card">
<h2>ChemQuest — Practice Mode</h2>
<p>No login required — just start playing!</p>
<div style="margin:1rem 0;">
<button class="btn btn-green" onclick="location.href='{{ url_for('quiz_start') }}'">Start Mixed Quiz ⚗️</button>
</div>
<h3 style="margin:1rem 0;">Topics</h3>
<div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
{% for topic, pct in mastery.items() %}
<div class="card" style="cursor:pointer;" onclick="location.href='{{ url_for('quiz_start') }}?topic={{ topic | urlencode }}'">
<strong>{{ topic }}</strong>
<div style="margin-top:0.5rem;">Mastery: {{ pct }}%</div>
<div class="mastery-bar" style="margin-top:0.25rem;"><div class="mastery-fill" style="width:{{ pct }}%;"></div></div>
</div>
{% endfor %}
</div>
</div>
</div>
{% endblock %}
