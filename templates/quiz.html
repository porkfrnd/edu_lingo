{% extends "base.html" %}
{% block content %}
<div class="fade-up">
<div style="display:flex; justify-content:space-between; margin-bottom:1rem;">
<span>Question {{ index }} of {{ total }}</span>
<span>Score: {{ score }}</span>
</div>
<div class="progress-bar"><div class="progress-fill" style="width:{{ (index/total)*100 }}%;"></div></div>
<div class="card fade-up" style="margin-top:1rem;">
<h3>{{ question.text }}</h3>
<div id="options">
{% for opt in options %}
<button class="option-btn" onclick="answer(this, '{{ opt }}')">{{ opt }}</button>
{% endfor %}
</div>
<div id="feedback" style="margin-top:1rem; font-weight:600;"></div>
</div>
</div>
{% endblock %}
{% block scripts %}
<script>
let answered = false;
function answer(btn, val) {
  if (answered) return;
  answered = true;
  fetch('/quiz/submit', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({question_id:{{ question.id }}, answer:val})})
    .then(r => r.json())
    .then(data => {
      if (data.already_answered) return;
      const btns = document.querySelectorAll('.option-btn');
      btns.forEach(b => { if (b.innerText === data.answer) b.classList.add('correct'); });
      if (data.correct) { btn.classList.add('correct', 'bounce'); } else { btn.classList.add('wrong', 'shake'); }
      const fb = document.getElementById('feedback');
      fb.textContent = (data.correct ? 'Correct! ' : 'Not quite. ') + (data.explanation || '');
      fb.style.color = data.correct ? 'var(--green)' : 'var(--red)';
      setTimeout(() => {
        fetch('/quiz/next').then(r => r.json()).then(d => {
          if (d.complete) location.href = '/quiz/complete';
          else location.href = '/quiz';
        });
      }, 4500);
    });
}
</script>
{% endblock %}
